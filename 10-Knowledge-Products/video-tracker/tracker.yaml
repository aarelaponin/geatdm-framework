# KP video tracker — manifest + manual state.
#
# What lives here: the list of KPs / modules / topics, and the few facts that cannot be read
# off disk.  Everything else (scripts, decks, briefs, takes, SRTs, cues, MP4s and their
# versions) is detected by render_tracker.py from videos/<module>/<lang>/.
#
# Per topic, per language, you may set:
#   accepted:  true | "v0.13"   the take of record has passed audit (a version string pins it;
#                               the tracker warns if a newer take appears on disk)
#   published: true | URL       on YouTube (a URL becomes a link)
#   blocker:   "text"           shows red; the row lands under BLOCKED in "Next actions"
#   note:      "text"           anything worth seeing next to the row
# The on-camera row (the KP intro; modules have no intro since 1 Oct 2026) additionally accepts:
#   filmed:    true|false       overrides the .mov-on-disk detection
#   mastered:  true|false       overrides the KP1_0.0_Video_v*.mp4 detection
#
# Bump `version` when the manifest structure or the topic list changes (not for a status tick).

version: 3
languages: [en, fr]        # fr rows are hidden by default until something exists for them

