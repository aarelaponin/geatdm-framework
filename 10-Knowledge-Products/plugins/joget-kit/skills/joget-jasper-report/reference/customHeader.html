<div style="max-width:1100px;margin:0 auto;padding:10px 14px;"><div style="display:flex;align-items:center;gap:10px;font-family:sans-serif;font-size:14px;"><label style="font-weight:600;">Statement date (as at):</label><input type="date" id="asOfDateInput" style="padding:4px 8px;border:1px solid #ccc;border-radius:4px;"/><button type="button" id="asOfDateBtn" style="padding:5px 16px;background:#1d4ed8;color:#fff;border:none;border-radius:4px;cursor:pointer;">Show</button></div></div><script>(function(){var u=new URLSearchParams(window.location.search);var v=u.get("asOfDate");var i=document.getElementById("asOfDateInput");if(i)i.value=v||new Date().toISOString().slice(0,10);var b=document.getElementById("asOfDateBtn");if(b)b.onclick=function(){var d=document.getElementById("asOfDateInput").value;var base=window.location.href.split("?")[0];window.location.href=base+(d?("?asOfDate="+encodeURIComponent(d)):"");};})();</script>
