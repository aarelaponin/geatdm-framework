openapi: 3.0.3
info:
  title: Data platform enrolment API
  version: 0.1.0
  description: Read API over Gold marts for the enrolment consumer.
servers:
- url: https://api.example.org
paths:
  /api/enrolment/district/schools:
    get:
      summary: The schools of one district, with learners and teachers in post.
      operationId: enrolment_district_schools
      security:
      - bearerAuth: []
      parameters:
      - name: district
        in: query
        required: true
        schema:
          type: string
        description: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistrictSchool'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/enrolment/schools/capacity:
    get:
      summary: Schools up to a given capacity, with learners enrolled and the grant they receive.
      operationId: enrolment_schools_capacity
      security:
      - bearerAuth: []
      parameters:
      - name: district
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: max_capacity
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolCapacity'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: keycloak access token
  schemas:
    DistrictSchool:
      type: object
      properties:
        school_code:
          type: string
        school_name:
          type: string
        district:
          type: string
        learners_enrolled:
          type: integer
        teachers_in_post:
          type: integer
    SchoolCapacity:
      type: object
      properties:
        school_code:
          type: string
        capacity:
          type: integer
        learners_enrolled:
          type: integer
        capitation_grant:
          type: number
security:
- bearerAuth: []
x-rbac-roles:
- emis_reader
- district_officer
