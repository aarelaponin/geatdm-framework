openapi: 3.0.3
info:
  title: Data platform enrolment API
  version: 0.1.0
  description: Read API over Gold marts for the enrolment consumer.
servers:
- url: https://api.example.org
paths:
  /api/enrolment/schools:
    get:
      summary: Enrolment and staffing for one school, or for schools above a size.
      operationId: enrolment_schools
      security:
      - bearerAuth: []
      parameters:
      - name: school_code
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: min_learners
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MartSchoolEnrolmentSummary'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: keycloak access token
  schemas:
    MartSchoolEnrolmentSummary:
      type: object
      properties:
        school_code:
          type: string
        school_name:
          type: string
        learners_enrolled:
          type: integer
security:
- bearerAuth: []
x-rbac-roles:
- emis_reader
