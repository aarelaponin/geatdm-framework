# The reading list for Start here's "Working with AI" pages and for every page of Working with AI in Government
# (the KP0 guide). Re-checked before every publish; bump `verified` when you do. gitbook_qa fails if a KP0 page
# cites a source whose address is not here.
# Sourcing rule (review of 26 Oct 2026): a page's argument rests first on a government or intergovernmental source
# (T1) or independent research (T2 research); vendor sources are used for how a tool works.
# Re-count before each publish: the AI Hallucination Cases total quoted on 1.1 (2,217 on 25 Oct 2026).
verified: 2026-10-26
