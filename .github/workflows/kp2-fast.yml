name: KP2 fast tier

# scripts/verify.sh --fast: static checks (hurl/check_scenarios.py, the
# kp-solution-verify ship gate, scripts/check-exposure.sh) plus
# `pytest tests/ apps/console/tests/`. No Docker container, no network, no
# federation -- measured ~8s on a dev machine
# (10-Knowledge-Products/KP2-GIF/KP2-build-pack/README.md).
#
# --live and --full are deliberately NOT run here, and this is the whole
# reason this workflow is scoped to --fast specifically: they need a real
# federation (~16 GB RAM, ~15 minutes for --full, testing-strategy plan
# Task 5's measurements) that a standard GitHub-hosted runner cannot
# provide. Green CI means the fast tier passed -- it does NOT mean the
# stack deploys, the acceptance suite passes, or the console works. See
# the pack's own README.md "Verify a change" section before assuming
# otherwise; run --live or --full locally, or on a self-hosted runner with
# Docker and the RAM to spare, for that.

on:
  push:
    paths:
      - "10-Knowledge-Products/KP2-GIF/KP2-build-pack/**"
  pull_request:
    paths:
      - "10-Knowledge-Products/KP2-GIF/KP2-build-pack/**"

defaults:
  run:
    working-directory: 10-Knowledge-Products/KP2-GIF/KP2-build-pack

jobs:
  fast:
    # Not ubuntu-latest: prebuilt Python 3.7 binaries are not guaranteed on
    # newer Ubuntu images going forward, and this pinning is the whole
    # point of Step 2 below -- a runner that silently can't provide 3.7
    # would defeat it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # apps/console runs on Python 3.12 in its own Dockerfile and its code
      # uses str.removesuffix/removeprefix (3.9+) accordingly -- installed
      # first (and referenced only by its captured python-path below) so
      # the 3.7 step after it wins the ambient `python3` PATH resolution
      # that every other step in this job relies on.
      - uses: actions/setup-python@v5
        id: console-python
        with:
          python-version: "3.12"

      # Pinned to the pack's own HOST floor, not the latest Python.
      # hurl/generate.py and hurl/check_scenarios.py run on the operator's
      # system python3 -- confirmed 3.7.9 in this pack's own dev history
      # (hurl/generate.py: "host runs system python3.7 -- no
      # str.removeprefix") -- not the containerised, newer Python
      # apps/console/ uses. This is the runtime the host scripts must
      # actually work on; CI is where that gets checked for free instead
      # of discovered live on someone's older machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install the host scripts' only hard Python dependency
        run: pip install pyyaml

      # tests/test_golden.py's own comment: generate.py's 3.7 constraints
      # are about the host interpreter, not "whatever interpreter is
      # running pytest" -- apps/console/tests/ imports apps/console code
      # that requires 3.9+, so this venv is built from the 3.12 interpreter
      # above by explicit path, not the ambient (3.7-pinned) `python3`.
      - name: Set up the venv scripts/verify.sh's pytest step needs
        run: |
          "${{ steps.console-python.outputs.python-path }}" -m venv .venv
          .venv/bin/pip install pytest httpx fastapi pyyaml

      # A fresh checkout has no .env (gitignored, never committed --
      # exposure-and-secrets plan Task 4) and no generated hurl/ artefacts
      # (also gitignored). --fast still needs both: check_scenarios.py
      # compares hurl/vars.env against .env and fails if either is stale
      # or missing, and check-exposure.sh's own lib.sh refuses a missing
      # .env outright. Confirmed live locally (simulating a fresh checkout
      # by moving .env and the generated hurl/ files aside) that --fast
      # fails without this step and passes with it -- not assumed.
      - name: Generate secrets and artefacts (fresh checkout has neither)
        run: |
          ./scripts/gen-secrets.sh
          python3 hurl/generate.py

      - name: scripts/verify.sh --fast
        run: ./scripts/verify.sh --fast
